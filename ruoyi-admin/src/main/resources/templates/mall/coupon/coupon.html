<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="btn-group-sm hidden-xs" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="mall:coupon:add">
                <i class="fa fa-plus"></i> Add
            </a>
            <a class="btn btn-primary btn-edit disabled" onclick="$.operate.edit()" shiro:hasPermission="mall:coupon:edit">
                <i class="fa fa-edit"></i> Edit
            </a>
            <a class="btn btn-danger btn-del disabled" onclick="$.operate.removeAll()" shiro:hasPermission="mall:coupon:remove">
                <i class="fa fa-remove"></i> Delete
            </a>
            <a class="btn btn-info" onclick="viewMemberCoupons()" shiro:hasPermission="mall:coupon:view">
                <i class="fa fa-users"></i> Member Coupons
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-mobile-responsive="true"></table>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    var editFlag   = [[${@permission.hasPermi('mall:coupon:edit')}]];
    var removeFlag = [[${@permission.hasPermi('mall:coupon:remove')}]];
    var prefix = ctx + "mall/coupon";

    function viewMemberCoupons() {
        window.location.href = prefix + "/member-coupons";
    }

    $(function() {
        $.table.init({
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            modalName: "Coupon",
            columns: [
                {checkbox: true},
                {field: 'couponId',       title: '编号',      width: 60},
                {field: 'name',           title: '名称'},
                {field: 'type',           title: '类型',    width: 120, formatter: function(v) {
                    var map = {free_delivery: 'Free Delivery', amount_off: 'Amount Off', percent_off: 'Percent Off'};
                    return map[v] || v;
                }},
                {field: 'discountAmount', title: '减免金额', width: 100, formatter: function(v, row) {
                    if (row.type === 'amount_off') return v + ' 元';
                    if (row.type === 'percent_off') return row.discountPercent + '%' + (row.maxDiscountAmount ? ' (最多减' + row.maxDiscountAmount + '元)' : '');
                    return '—';
                }},
                {field: 'minOrderAmount', title: '最低订单', width: 90, formatter: function(v) { return v > 0 ? v + ' 元' : 'None'; }},
                {field: 'validDays',      title: '有效天数', width: 80},
                {field: 'isFirstOrderOnly', title: '仅首单', width: 100, formatter: function(v) {
                    return v === 1 ? '<span class="badge badge-warning">Yes</span>' : 'No';
                }},
                {field: 'status',         title: '状态', width: 80, formatter: function(v) {
                    return v === 0
                        ? '<span class="badge badge-primary">Enabled</span>'
                        : '<span class="badge badge-default">Disabled</span>';
                }},
                {field: 'createTime',     title: '创建时间'},
                {title: '操作', align: 'center', formatter: function(v, row) {
                    var a = [];
                    if (editFlag)   a.push('<a class="btn btn-success btn-xs" onclick="$.operate.edit(\'' + row.couponId + '\')"><i class="fa fa-edit"></i>Edit</a> ');
                    if (removeFlag) a.push('<a class="btn btn-danger btn-xs" onclick="$.operate.remove(\'' + row.couponId + '\')"><i class="fa fa-remove"></i>Delete</a>');
                    return a.join('');
                }}
            ]
        });
    });
</script>
</body>
</html>
