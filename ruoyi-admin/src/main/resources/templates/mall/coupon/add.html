<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <form class="form-horizontal m" id="form-coupon-add">
                <div class="form-group">
                    <label class="col-sm-3 control-label">Name <span class="text-red">*</span></label>
                    <div class="col-sm-8">
                        <input name="name" class="form-control" type="text" required placeholder="e.g. Free Delivery">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-3 control-label">Type <span class="text-red">*</span></label>
                    <div class="col-sm-8">
                        <select name="type" class="form-control" id="couponType" onchange="toggleFields()">
                            <option value="free_delivery">Free Delivery</option>
                            <option value="amount_off">Amount Off (¥X off)</option>
                            <option value="percent_off">Percent Off (X% off)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" id="amountRow" style="display:none">
                    <label class="col-sm-3 control-label">Discount Amount (¥)</label>
                    <div class="col-sm-8">
                        <input name="discountAmount" class="form-control" type="number" step="0.01" value="0">
                    </div>
                </div>
                <div class="form-group" id="percentRow" style="display:none">
                    <label class="col-sm-3 control-label">Discount Percent (%)</label>
                    <div class="col-sm-8">
                        <input name="discountPercent" class="form-control" type="number" min="1" max="100" value="0">
                    </div>
                </div>
                <div class="form-group" id="maxDiscountRow" style="display:none">
                    <label class="col-sm-3 control-label">Max Discount Cap (¥)</label>
                    <div class="col-sm-8">
                        <input name="maxDiscountAmount" class="form-control" type="number" step="0.01" placeholder="Leave blank for no cap">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-3 control-label">Min Order Amount (¥)</label>
                    <div class="col-sm-8">
                        <input name="minOrderAmount" class="form-control" type="number" step="0.01" value="0">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-3 control-label">Valid Days</label>
                    <div class="col-sm-8">
                        <input name="validDays" class="form-control" type="number" min="1" value="30">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-3 control-label">First Order Only?</label>
                    <div class="col-sm-8">
                        <select name="isFirstOrderOnly" class="form-control">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    function toggleFields() {
        var type = $('#couponType').val();
        $('#amountRow').toggle(type === 'amount_off');
        $('#percentRow, #maxDiscountRow').toggle(type === 'percent_off');
    }
    toggleFields();

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(ctx + "mall/coupon/add", $('#form-coupon-add').serialize());
        }
    }
</script>
</body>
</html>
