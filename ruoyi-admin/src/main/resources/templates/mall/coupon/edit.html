<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <form class="form-horizontal m" id="form-coupon-edit">
                <input type="hidden" name="couponId" th:value="${coupon.couponId}">
                <div class="form-group">
                    <label class="col-sm-3 control-label">Name <span class="text-red">*</span></label>
                    <div class="col-sm-8">
                        <input name="name" class="form-control" type="text" required th:value="${coupon.name}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-3 control-label">Type</label>
                    <div class="col-sm-8">
                        <select name="type" class="form-control" id="couponType" onchange="toggleFields()" th:value="${coupon.type}">
                            <option value="free_delivery" th:selected="${coupon.type == 'free_delivery'}">Free Delivery</option>
                            <option value="amount_off"    th:selected="${coupon.type == 'amount_off'}">Amount Off (₱X off)</option>
                            <option value="percent_off"   th:selected="${coupon.type == 'percent_off'}">Percent Off (X% off)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" id="amountRow">
                    <label class="col-sm-3 control-label">Discount Amount (₱)</label>
                    <div class="col-sm-8">
                        <input name="discountAmount" class="form-control" type="number" step="0.01" th:value="${coupon.discountAmount}">
                    </div>
                </div>
                <div class="form-group" id="percentRow">
                    <label class="col-sm-3 control-label">Discount Percent (%)</label>
                    <div class="col-sm-8">
                        <input name="discountPercent" class="form-control" type="number" min="0" max="100" th:value="${coupon.discountPercent}">
                    </div>
                </div>
                <div class="form-group" id="maxDiscountRow">
                    <label class="col-sm-3 control-label">Max Discount Cap (₱)</label>
                    <div class="col-sm-8">
                        <input name="maxDiscountAmount" class="form-control" type="number" step="0.01" th:value="${coupon.maxDiscountAmount}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-3 control-label">Min Order Amount (₱)</label>
                    <div class="col-sm-8">
                        <input name="minOrderAmount" class="form-control" type="number" step="0.01" th:value="${coupon.minOrderAmount}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-3 control-label">Valid Days</label>
                    <div class="col-sm-8">
                        <input name="validDays" class="form-control" type="number" min="1" th:value="${coupon.validDays}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-3 control-label">First Order Only?</label>
                    <div class="col-sm-8">
                        <select name="isFirstOrderOnly" class="form-control">
                            <option value="0" th:selected="${coupon.isFirstOrderOnly == 0}">No</option>
                            <option value="1" th:selected="${coupon.isFirstOrderOnly == 1}">Yes</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-3 control-label">Status</label>
                    <div class="col-sm-8">
                        <select name="status" class="form-control">
                            <option value="0" th:selected="${coupon.status == 0}">Enabled</option>
                            <option value="1" th:selected="${coupon.status == 1}">Disabled</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    function toggleFields() {
        var type = $('#couponType').val();
        $('#amountRow').toggle(type === 'amount_off');
        $('#percentRow, #maxDiscountRow').toggle(type === 'percent_off');
    }
    toggleFields();

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(ctx + "mall/coupon/edit", $('#form-coupon-edit').serialize());
        }
    }
</script>
</body>
</html>
