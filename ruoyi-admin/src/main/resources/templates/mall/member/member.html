<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="member-form">
                <div class="select-list">
                    <ul>
                        <li>Email：<input type="text" name="email"/></li>
                        <li>Nickname：<input type="text" name="nickName"/></li>
                        <li>
                            Status：
                            <select name="status">
                                <option value="">All</option>
                                <option value="0">Active</option>
                                <option value="1">Disabled</option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Search</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Reset</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-mobile-responsive="true"></table>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    var prefix = ctx + "mall/member";
    var editFlag = [[${@permission.hasPermi('mall:member:edit')}]];
    $(function() {
        $.table.init({
            url: prefix + "/list",
            modalName: "Member",
            columns: [
                {checkbox: true},
                {field: 'memberId',   title: 'Member ID'},
                {field: 'avatarUrl',  title: 'Avatar', formatter: function(v) {
                    return v ? '<img src="' + v + '" height="36" style="border-radius:50%">' : '<i class="fa fa-user-circle fa-2x text-muted"></i>';
                }},
                {field: 'nickName',   title: 'Nickname'},
                {field: 'email',      title: 'Email'},
                {field: 'phone',      title: 'Phone'},
                {field: 'status',     title: 'Status', align: 'center',
                    formatter: function(v) {
                        return v === '0'
                            ? '<span class="badge badge-primary">Active</span>'
                            : '<span class="badge badge-danger">Disabled</span>';
                    }
                },
                {field: 'role',       title: 'Role', align: 'center',
                    formatter: function(v) {
                        if (v === 'cashier') return '<span class="badge" style="background:#1ab394">Cashier</span>';
                        if (v === 'admin')   return '<span class="badge" style="background:#23c6c8">Admin</span>';
                        return '<span class="badge badge-default">Customer</span>';
                    }
                },
                {field: 'createTime', title: 'Registered At', sortable: true},
                {title: 'Action', align: 'center', formatter: function(v, row) {
                    if (row.role === 'cashier') {
                        return '<a class="btn btn-warning btn-xs ' + editFlag + '" onclick="setRole(\'' + row.memberId + '\',\'customer\')"><i class="fa fa-user"></i> Unset Cashier</a>';
                    }
                    if (row.role === 'admin') { return '<span class="text-muted">-</span>'; }
                    return '<a class="btn btn-success btn-xs ' + editFlag + '" onclick="setRole(\'' + row.memberId + '\',\'cashier\')"><i class="fa fa-shopping-cart"></i> Set Cashier</a>';
                }}
            ]
        });
    });

    // 设置会员角色（收银员/顾客）
    function setRole(memberId, role) {
        var msg = role === 'cashier' ? 'Set this member as Cashier?' : 'Change this member back to Customer?';
        $.modal.confirm(msg, function() {
            $.operate.post(prefix + '/role', { memberId: memberId, role: role });
        });
    }
</script>
</body>
</html>
