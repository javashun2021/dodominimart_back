<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-category-edit">
        <input type="hidden" name="categoryId" th:value="${category.categoryId}">
        <div class="form-group">
            <label class="col-sm-3 control-label">分类名称：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="name" th:value="${category.name}" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">图标URL：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="iconUrl" th:value="${category.iconUrl}">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">排序：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" name="sort" th:value="${category.sort}">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">状态：</label>
            <div class="col-sm-8">
                <div class="radio-box">
                    <input type="radio" id="status0" name="status" value="0" th:checked="${category.status == '0'}">
                    <label for="status0">显示</label>
                </div>
                <div class="radio-box">
                    <input type="radio" id="status1" name="status" value="1" th:checked="${category.status == '1'}">
                    <label for="status1">隐藏</label>
                </div>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script>
    var prefix = ctx + "mall/category";
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-category-edit').serialize());
        }
    }
</script>
</body>
</html>
