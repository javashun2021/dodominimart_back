<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-category-edit">
        <input type="hidden" name="categoryId" th:value="${category.categoryId}">
        <div class="form-group">
            <label class="col-sm-3 control-label">Category Name：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="name" th:value="${category.name}" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Category Icon：</label>
            <div class="col-sm-8">
                <div class="input-group">
                    <input class="form-control" type="text" id="iconUrl" name="iconUrl" th:value="${category.iconUrl}" placeholder="Auto-filled after upload">
                    <span class="input-group-btn">
                        <label class="btn btn-default" for="uploadIconFile"><i class="fa fa-upload"></i> Upload</label>
                        <input type="file" id="uploadIconFile" accept="image/*" style="display:none" onchange="uploadIcon(this)">
                    </span>
                </div>
                <div id="iconPreview" th:style="${category.iconUrl != null and category.iconUrl != ''} ? 'margin-top:8px' : 'margin-top:8px;display:none'">
                    <img id="previewIcon" th:src="${category.iconUrl}" height="60" style="border-radius:4px;border:1px solid #ddd;padding:2px">
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Sort：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" name="sort" th:value="${category.sort}">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Status：</label>
            <div class="col-sm-8">
                <div class="radio-box">
                    <input type="radio" id="status0" name="status" value="0" th:checked="${category.status == '0'}">
                    <label for="status0">Visible</label>
                </div>
                <div class="radio-box">
                    <input type="radio" id="status1" name="status" value="1" th:checked="${category.status == '1'}">
                    <label for="status1">Hidden</label>
                </div>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script>
    var prefix = ctx + "mall/category";
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-category-edit').serialize());
        }
    }
    function uploadIcon(input) {
        if (!input.files || !input.files[0]) return;
        var formData = new FormData();
        formData.append('file', input.files[0]);
        $.ajax({
            url: ctx + 'common/upload',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(res) {
                if (res.code === 0) {
                    $('#iconUrl').val(res.path);
                    $('#previewIcon').attr('src', res.url);
                    $('#iconPreview').show();
                } else {
                    $.modal.alertWarning(res.msg);
                }
            }
        });
    }
</script>
</body>
</html>
