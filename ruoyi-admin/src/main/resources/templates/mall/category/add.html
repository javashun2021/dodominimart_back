<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-category-add">
        <div class="form-group">
            <label class="col-sm-3 control-label">分类名称：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="name" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">分类图标：</label>
            <div class="col-sm-8">
                <div class="input-group">
                    <input class="form-control" type="text" id="iconUrl" name="iconUrl" placeholder="上传后自动填入">
                    <span class="input-group-btn">
                        <label class="btn btn-default" for="uploadIconFile"><i class="fa fa-upload"></i> 上传</label>
                        <input type="file" id="uploadIconFile" accept="image/*" style="display:none" onchange="uploadIcon(this)">
                    </span>
                </div>
                <div id="iconPreview" style="margin-top:8px;display:none">
                    <img id="previewIcon" height="60" style="border-radius:4px;border:1px solid #ddd;padding:2px">
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">排序：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" name="sort" value="0">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">状态：</label>
            <div class="col-sm-8">
                <div class="radio-box">
                    <input type="radio" id="status0" name="status" value="0" checked>
                    <label for="status0">显示</label>
                </div>
                <div class="radio-box">
                    <input type="radio" id="status1" name="status" value="1">
                    <label for="status1">隐藏</label>
                </div>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script>
    var prefix = ctx + "mall/category";
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/add", $('#form-category-add').serialize());
        }
    }
    function uploadIcon(input) {
        if (!input.files || !input.files[0]) return;
        var formData = new FormData();
        formData.append('file', input.files[0]);
        $.ajax({
            url: ctx + 'common/upload',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(res) {
                if (res.code === 0) {
                    $('#iconUrl').val(res.path);
                    $('#previewIcon').attr('src', res.url);
                    $('#iconPreview').show();
                } else {
                    $.modal.alertWarning(res.msg);
                }
            }
        });
    }
</script>
</body>
</html>
