<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="flashsale-form">
                <div class="select-list">
                    <ul>
                        <li>Activity Name：<input type="text" name="title"/></li>
                        <li>Status：
                            <select name="status">
                                <option value="">All</option>
                                <option value="0">Not Started</option>
                                <option value="1">Active</option>
                                <option value="2">Ended</option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Search</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Reset</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>
        <div class="btn-group-sm hidden-xs" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="mall:flashsale:add">
                <i class="fa fa-plus"></i> Add
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-mobile-responsive="true"></table>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    var editFlag   = [[${@permission.hasPermi('mall:flashsale:edit')}]];
    var removeFlag = [[${@permission.hasPermi('mall:flashsale:remove')}]];
    var prefix = ctx + "mall/flashsale";

    $(function() {
        $.table.init({
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            modalName: "Flash Sale",
            columns: [
                {checkbox: true},
                {field: 'saleId',      title: '编号'},
                {field: 'productName', title: '商品名称'},
                {field: 'title',       title: '活动名称'},
                {field: 'flashPrice',  title: '秒杀价'},
                {field: 'stockLimit',  title: '库存上限'},
                {field: 'soldCount',   title: '已售'},
                {field: 'perLimit',    title: '每人限购'},
                {field: 'startTime',   title: '开始时间'},
                {field: 'endTime',     title: '结束时间'},
                {field: 'status', title: '状态', align: 'center',
                    formatter: function(v) {
                        var map = {'0': '<span class="badge badge-default">Not Started</span>',
                                   '1': '<span class="badge badge-primary">Active</span>',
                                   '2': '<span class="badge badge-danger">Ended</span>'};
                        return map[v] || v;
                    }
                },
                {title: '操作', align: 'center', formatter: function(v, row) {
                    var a = [];
                    if (row.status !== '2') {
                        a.push('<a class="btn btn-success btn-xs ' + editFlag + '" onclick="$.operate.edit(\'' + row.saleId + '\')"><i class="fa fa-edit"></i>Edit</a> ');
                        a.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" onclick="$.operate.remove(\'' + row.saleId + '\')"><i class="fa fa-remove"></i>End</a>');
                    }
                    return a.join('');
                }}
            ]
        });
    });
</script>
</body>
</html>
