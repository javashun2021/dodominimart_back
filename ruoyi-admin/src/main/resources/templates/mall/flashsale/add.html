<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-flashsale-add">
        <div class="form-group">
            <label class="col-sm-3 control-label">活动名称：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="title" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">商品ID：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" name="productId" required placeholder="请输入商品ID">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">活动价(PHP)：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" step="0.01" min="0" name="flashPrice" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">活动限量：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" min="1" name="stockLimit" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">每人限购：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" min="1" name="perLimit" value="1">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">开始时间：</label>
            <div class="col-sm-8">
                <input class="form-control" type="datetime-local" name="startTime" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">结束时间：</label>
            <div class="col-sm-8">
                <input class="form-control" type="datetime-local" name="endTime" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">状态：</label>
            <div class="col-sm-8">
                <div class="radio-box">
                    <input type="radio" id="s0" name="status" value="0" checked>
                    <label for="s0">未开始</label>
                </div>
                <div class="radio-box">
                    <input type="radio" id="s1" name="status" value="1">
                    <label for="s1">进行中</label>
                </div>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script>
    var prefix = ctx + "mall/flashsale";
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/add", $('#form-flashsale-add').serialize());
        }
    }
</script>
</body>
</html>
