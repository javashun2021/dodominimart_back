<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title th:text="${shopName} + ' — 订单'">订单</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f5f7; color: #222;
               font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
        .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
        .card { background: #fff; border-radius: 12px; padding: 18px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 14px; }
        .center { text-align: center; }
        .logo { max-width: 140px; max-height: 70px; display: block; margin: 0 auto 8px; }
        .shop-name { font-weight: 700; font-size: 18px; }
        .muted { color: #888; font-size: 13px; }
        h4 { margin: 0 0 10px; font-size: 14px; color: #1ab394; }
        .info p { margin: 4px 0; font-size: 14px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; color: #fff; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 7px 4px; font-size: 14px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        td.num, th.num { text-align: right; white-space: nowrap; }
        .totals .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 14px; }
        .totals .grand { font-weight: 700; font-size: 17px; border-top: 1px solid #ddd; padding-top: 8px; margin-top: 6px; }
        .open-app { display: block; text-align: center; background: #1ab394; color: #fff; text-decoration: none;
                    padding: 13px; border-radius: 10px; font-weight: 600; font-size: 15px; }
        .footer { text-align: center; color: #999; font-size: 12px; margin: 18px 0; }
    </style>
</head>
<body>
<div class="wrap">

    <div class="card center">
        <img class="logo" th:src="@{/img/receipt-logo.jpg}" alt="logo">
        <div class="shop-name" th:text="${shopName}">DODOMINIMART</div>
        <div class="muted" th:if="${shopAddress != null and shopAddress != ''}" th:text="${shopAddress}"></div>
        <div class="muted" th:if="${shopPhone != null and shopPhone != ''}" th:text="'电话: ' + ${shopPhone}"></div>
    </div>

    <div class="card">
        <h4>订单信息</h4>
        <div class="info">
            <p><strong>订单号：</strong> <span th:text="${order.orderNo}"></span></p>
            <p><strong>下单时间：</strong> <span th:text="${#dates.format(order.createTime,'yyyy-MM-dd HH:mm')}"></span></p>
            <p><strong>类型：</strong>
                <span th:switch="${order.orderSource}">
                    <span th:case="'IN_STORE'">到店自提</span>
                    <span th:case="*">配送</span>
                </span>
                &nbsp;|&nbsp; <strong>支付方式：</strong> <span th:text="${order.paymentMethod}"></span>
            </p>
            <p><strong>状态：</strong>
                <span th:switch="${order.status}">
                    <span th:case="'0'" class="badge" style="background:#f0ad4e">待确认</span>
                    <span th:case="'1'" class="badge" style="background:#337ab7">已确认</span>
                    <span th:case="'2'" class="badge" style="background:#5bc0de">配送中</span>
                    <span th:case="'3'" class="badge" style="background:#1ab394">已完成</span>
                    <span th:case="'4'" class="badge" style="background:#999">已取消</span>
                </span>
            </p>
        </div>
    </div>

    <div class="card">
        <h4>订单商品</h4>
        <table>
            <thead>
                <tr>
                    <th>商品</th>
                    <th class="num">价格</th>
                    <th class="num">数量</th>
                    <th class="num">金额</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${order.items}">
                    <td th:text="${item.productName}"></td>
                    <td class="num" th:text="${item.price} + ' 元'"></td>
                    <td class="num" th:text="${item.quantity}"></td>
                    <td class="num" th:text="${item.subtotal} + ' 元'"></td>
                </tr>
            </tbody>
        </table>
        <div class="totals" style="margin-top:10px">
            <div class="row" th:if="${order.couponDiscount != null and order.couponDiscount.signum() > 0}">
                <span>优惠券抵扣</span><span th:text="'-' + ${order.couponDiscount} + ' 元'"></span>
            </div>
            <div class="row" th:if="${order.pointsUsed > 0}">
                <span>积分抵扣 (<span th:text="${order.pointsUsed}"></span> 分)</span><span th:text="'-' + ${order.pointsUsed / 10} + ' 元'"></span>
            </div>
            <div class="row" th:if="${order.deliveryFee != null and order.deliveryFee.signum() > 0}">
                <span>配送费</span><span th:text="${order.deliveryFee} + ' 元'"></span>
            </div>
            <div class="row grand">
                <span>应付金额</span><span th:text="${order.totalAmount} + ' 元'"></span>
            </div>
        </div>
    </div>

    <a class="open-app" th:href="${appScheme}">用 App 打开</a>

    <div class="footer" th:text="${shopFooter}">Thank you for shopping!</div>

</div>
</body>
</html>
