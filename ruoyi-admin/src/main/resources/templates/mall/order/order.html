<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="order-form">
                <div class="select-list">
                    <ul>
                        <li>Order No：<input type="text" name="orderNo"/></li>
                        <li>
                            Status：
                            <select name="status">
                                <option value="">All</option>
                                <option value="0">Pending</option>
                                <option value="1">Confirmed</option>
                                <option value="2">Delivering</option>
                                <option value="3">Completed</option>
                                <option value="4">Cancelled</option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Search</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Reset</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-mobile-responsive="true"></table>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('mall:order:edit')}]];
    var prefix   = ctx + "mall/order";

    var statusMap = {'0':'<span class="badge" style="background:#f0ad4e">Pending</span>',
                     '1':'<span class="badge badge-primary">Confirmed</span>',
                     '2':'<span class="badge" style="background:#5bc0de">Delivering</span>',
                     '3':'<span class="badge badge-success">Completed</span>',
                     '4':'<span class="badge badge-default">Cancelled</span>'};
    var sourceMap  = {'NORMAL':     '<span class="badge badge-default">Normal</span>',
                      'FLASH_SALE': '<span class="badge" style="background:#e74c3c">Flash Sale</span>',
                      'GROUP':      '<span class="badge" style="background:#8e44ad">Group Buy</span>'};

    $(function() {
        $.table.init({
            url: prefix + "/list",
            modalName: "Order",
            columns: [
                {checkbox: true},
                {field: 'orderNo',      title: 'Order No'},
                {field: 'totalAmount',  title: 'Amount (PHP)', formatter: function(v) { return '₱' + v; }},
                {field: 'orderSource',  title: 'Source', align: 'center',
                    formatter: function(v) { return sourceMap[v] || v; }
                },
                {field: 'status',       title: 'Status', align: 'center',
                    formatter: function(v) { return statusMap[v] || v; }
                },
                {field: 'remark',       title: 'Remark'},
                {field: 'createTime',   title: 'Order Time', sortable: true},
                {title: 'Action', align: 'center', formatter: function(v, row) {
                    var a = [];
                    a.push('<a class="btn btn-info btn-xs" href="' + prefix + '/detail/' + row.orderId + '"><i class="fa fa-eye"></i>Detail</a> ');
                    if (row.status === '0') {
                        a.push('<a class="btn btn-primary btn-xs ' + editFlag + '" onclick="changeStatus(' + row.orderId + ',\'1\')"><i class="fa fa-check"></i>Confirm</a> ');
                        a.push('<a class="btn btn-danger btn-xs ' + editFlag + '" onclick="changeStatus(' + row.orderId + ',\'4\')"><i class="fa fa-ban"></i>Cancel</a> ');
                    }
                    if (row.status === '1') {
                        a.push('<a class="btn btn-primary btn-xs ' + editFlag + '" onclick="changeStatus(' + row.orderId + ',\'2\')"><i class="fa fa-truck"></i>Deliver</a> ');
                    }
                    if (row.status === '2') {
                        a.push('<a class="btn btn-success btn-xs ' + editFlag + '" onclick="changeStatus(' + row.orderId + ',\'3\')"><i class="fa fa-flag"></i>Complete</a>');
                    }
                    return a.join('');
                }}
            ]
        });
    });

    function changeStatus(orderId, status) {
        var msg = {1:'Confirm Order', 2:'Mark as Delivering', 3:'Mark as Completed', 4:'Cancel Order'}[status];
        $.modal.confirm('Are you sure to [' + msg + ']?', function() {
            $.operate.post(prefix + '/changeStatus', {orderId: orderId, status: status});
        });
    }
</script>
</body>
</html>
