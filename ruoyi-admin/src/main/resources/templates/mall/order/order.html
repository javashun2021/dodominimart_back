<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="order-form">
                <div class="select-list">
                    <ul>
                        <li>订单编号：<input type="text" name="orderNo"/></li>
                        <li>
                            订单状态：
                            <select name="status">
                                <option value="">全部</option>
                                <option value="0">待确认</option>
                                <option value="1">已确认</option>
                                <option value="2">配送中</option>
                                <option value="3">已完成</option>
                                <option value="4">已取消</option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-mobile-responsive="true"></table>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('mall:order:edit')}]];
    var prefix   = ctx + "mall/order";

    var statusMap = {'0':'<span class="badge" style="background:#f0ad4e">待确认</span>',
                     '1':'<span class="badge badge-primary">已确认</span>',
                     '2':'<span class="badge" style="background:#5bc0de">配送中</span>',
                     '3':'<span class="badge badge-success">已完成</span>',
                     '4':'<span class="badge badge-default">已取消</span>'};
    var sourceMap  = {'NORMAL':     '<span class="badge badge-default">普通</span>',
                      'FLASH_SALE': '<span class="badge" style="background:#e74c3c">限时优惠</span>',
                      'GROUP':      '<span class="badge" style="background:#8e44ad">拼团</span>'};

    $(function() {
        $.table.init({
            url: prefix + "/list",
            modalName: "订单",
            columns: [
                {checkbox: true},
                {field: 'orderNo',      title: '订单编号'},
                {field: 'totalAmount',  title: '金额(PHP)', formatter: function(v) { return '₱' + v; }},
                {field: 'orderSource',  title: '来源', align: 'center',
                    formatter: function(v) { return sourceMap[v] || v; }
                },
                {field: 'status',       title: '状态', align: 'center',
                    formatter: function(v) { return statusMap[v] || v; }
                },
                {field: 'remark',       title: '备注'},
                {field: 'createTime',   title: '下单时间', sortable: true},
                {title: '操作', align: 'center', formatter: function(v, row) {
                    var a = [];
                    a.push('<a class="btn btn-info btn-xs" href="' + prefix + '/detail/' + row.orderId + '"><i class="fa fa-eye"></i>详情</a> ');
                    if (row.status === '0') {
                        a.push('<a class="btn btn-primary btn-xs ' + editFlag + '" onclick="changeStatus(' + row.orderId + ',\'1\')"><i class="fa fa-check"></i>确认</a> ');
                        a.push('<a class="btn btn-danger btn-xs ' + editFlag + '" onclick="changeStatus(' + row.orderId + ',\'4\')"><i class="fa fa-ban"></i>取消</a> ');
                    }
                    if (row.status === '1') {
                        a.push('<a class="btn btn-primary btn-xs ' + editFlag + '" onclick="changeStatus(' + row.orderId + ',\'2\')"><i class="fa fa-truck"></i>配送</a> ');
                    }
                    if (row.status === '2') {
                        a.push('<a class="btn btn-success btn-xs ' + editFlag + '" onclick="changeStatus(' + row.orderId + ',\'3\')"><i class="fa fa-flag"></i>完成</a>');
                    }
                    return a.join('');
                }}
            ]
        });
    });

    function changeStatus(orderId, status) {
        var msg = {1:'确认订单', 2:'标记配送中', 3:'标记已完成', 4:'取消订单'}[status];
        $.modal.confirm('确认要【' + msg + '】吗？', function() {
            $.operate.post(prefix + '/changeStatus', {orderId: orderId, status: status});
        });
    }
</script>
</body>
</html>
