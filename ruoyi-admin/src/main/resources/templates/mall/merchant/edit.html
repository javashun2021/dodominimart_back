<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-merchant-edit" th:object="${merchant}">
        <input type="hidden" name="merchantId" th:field="*{merchantId}">
        <div class="form-group">
            <label class="col-sm-3 control-label">Merchant Name：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="name" th:field="*{name}" required></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Category：</label>
            <div class="col-sm-8">
                <select class="form-control" name="category" th:field="*{category}" th:with="type=${@dict.getType('mall_merchant_type')}">
                    <option th:each="d : ${type}" th:text="${d.dictLabel}" th:value="${d.dictValue}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Description：</label>
            <div class="col-sm-8"><textarea class="form-control" name="description" rows="2" th:field="*{description}"></textarea></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Address：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="address" th:field="*{address}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Latitude：</label>
            <div class="col-sm-8"><input class="form-control" type="number" step="0.0000001" name="lat" th:field="*{lat}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Longitude：</label>
            <div class="col-sm-8"><input class="form-control" type="number" step="0.0000001" name="lng" th:field="*{lng}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Phone：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="phone" th:field="*{phone}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Business Hours：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="businessHours" th:field="*{businessHours}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Logo URL：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="logoUrl" th:field="*{logoUrl}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Images (comma URLs)：</label>
            <div class="col-sm-8"><textarea class="form-control" name="images" rows="2" th:field="*{images}"></textarea></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Sort：</label>
            <div class="col-sm-8"><input class="form-control" type="number" name="sort" th:field="*{sort}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Status：</label>
            <div class="col-sm-8">
                <select class="form-control" name="status" th:with="s=*{status}">
                    <option value="0" th:selected="${s=='0'}">Pending</option>
                    <option value="1" th:selected="${s=='1'}">Open</option>
                    <option value="2" th:selected="${s=='2'}">Rejected</option>
                    <option value="3" th:selected="${s=='3'}">Suspended</option>
                </select>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script>
    var prefix = ctx + "mall/merchant";
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-merchant-edit').serialize());
        }
    }
</script>
</body>
</html>
