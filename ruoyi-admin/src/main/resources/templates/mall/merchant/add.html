<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-merchant-add">
        <div class="form-group">
            <label class="col-sm-3 control-label">Merchant Name：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="name" required></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Category：</label>
            <div class="col-sm-8">
                <select class="form-control" name="category" th:with="type=${@dict.getType('mall_merchant_type')}">
                    <option th:each="d : ${type}" th:text="${d.dictLabel}" th:value="${d.dictValue}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Description：</label>
            <div class="col-sm-8"><textarea class="form-control" name="description" rows="2"></textarea></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Address：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="address"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Latitude：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" step="0.0000001" name="lat" placeholder="e.g. 14.5995000">
                <span class="help-block">用于 App「附近商家」按 GPS 距离排序，务必填真实坐标</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Longitude：</label>
            <div class="col-sm-8"><input class="form-control" type="number" step="0.0000001" name="lng" placeholder="e.g. 120.9842000"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Phone：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="phone"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Business Hours：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="businessHours" placeholder="08:00-22:00"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Other Contacts：</label>
            <div class="col-sm-8">
                <input type="hidden" name="contactInfo" id="contactInfo">
                <div class="input-group" style="margin-bottom:6px"><span class="input-group-addon" style="width:110px;text-align:left">WhatsApp</span><input class="form-control ci" data-key="whatsapp" type="text" placeholder="+63 9xx xxx xxxx"></div>
                <div class="input-group" style="margin-bottom:6px"><span class="input-group-addon" style="width:110px;text-align:left">Messenger</span><input class="form-control ci" data-key="messenger" type="text" placeholder="m.me/yourpage 或用户名"></div>
                <div class="input-group" style="margin-bottom:6px"><span class="input-group-addon" style="width:110px;text-align:left">Telegram</span><input class="form-control ci" data-key="telegram" type="text" placeholder="@username 或 t.me/xxx"></div>
                <div class="input-group" style="margin-bottom:6px"><span class="input-group-addon" style="width:110px;text-align:left">Viber</span><input class="form-control ci" data-key="viber" type="text" placeholder="+63 9xx xxx xxxx"></div>
                <div class="input-group"><span class="input-group-addon" style="width:110px;text-align:left">WeChat</span><input class="form-control ci" data-key="wechat" type="text" placeholder="WeChat ID"></div>
                <span class="help-block" style="margin-bottom:0;">区别于 Phone，供 App 显示 Messenger / Telegram 等联系方式（留空的不保存）</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Logo / Main Image：</label>
            <div class="col-sm-8">
                <div class="input-group">
                    <input class="form-control" type="text" id="logoUrl" name="logoUrl">
                    <span class="input-group-btn">
                        <label class="btn btn-default" for="uploadLogo"><i class="fa fa-upload"></i> Upload</label>
                        <input type="file" id="uploadLogo" accept="image/*" style="display:none">
                    </span>
                </div>
                <div id="logoPreview" style="margin-top:8px;display:none">
                    <img id="logoImg" src="" height="80" style="border-radius:4px;border:1px solid #ddd;padding:2px">
                </div>
                <span class="help-block" style="margin-bottom:0;">Main image — shown on the merchant card & detail header</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Store Photos：</label>
            <div class="col-sm-8">
                <input type="hidden" id="images" name="images">
                <span class="input-group-btn">
                    <label class="btn btn-default" for="uploadImages"><i class="fa fa-plus"></i> Add photos</label>
                    <input type="file" id="uploadImages" accept="image/*" multiple style="display:none">
                </span>
                <div id="imagesPreview" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"></div>
                <span class="help-block" style="margin-bottom:0;">Storefront gallery on merchant detail (multiple allowed, tap × to remove)</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Sort：</label>
            <div class="col-sm-8"><input class="form-control" type="number" name="sort" value="0"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Status：</label>
            <div class="col-sm-8">
                <select class="form-control" name="status">
                    <option value="0">Pending</option>
                    <option value="1">Open</option>
                    <option value="3">Suspended</option>
                </select>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script>
    var prefix = ctx + "mall/merchant";
    // 把结构化联系方式输入收成 JSON 写入隐藏字段(只保留填了值的)；空则存空串
    function collectContactInfo() {
        var obj = {};
        $('.ci').each(function() {
            var k = $(this).data('key'), v = $.trim($(this).val());
            if (v) obj[k] = v;
        });
        $('#contactInfo').val(Object.keys(obj).length ? JSON.stringify(obj) : '');
    }
    function submitHandler() {
        if ($.validate.form()) {
            collectContactInfo();
            $.operate.save(prefix + "/add", $('#form-merchant-add').serialize());
        }
    }

    // 主图上传（存相对路径 /profile/upload/...，App 与后台同源显示均可用）
    function uploadLogo(input) {
        if (!input.files || !input.files[0]) return;
        var fd = new FormData();
        fd.append('file', input.files[0]);
        $.ajax({
            url: ctx + 'common/upload', type: 'POST', data: fd,
            processData: false, contentType: false,
            success: function(res) {
                if (res.code === 0) {
                    $('#logoUrl').val(res.path);
                    $('#logoImg').attr('src', res.path);
                    $('#logoPreview').show();
                } else {
                    $.modal.alertWarning(res.msg);
                }
            }
        });
    }

    // 店铺照多图（存逗号分隔相对路径）
    var storeImages = [];
    function renderImages() {
        $('#images').val(storeImages.join(','));
        var html = '';
        for (var i = 0; i < storeImages.length; i++) {
            html += '<div style="position:relative;display:inline-block">'
                  + '<img src="' + storeImages[i] + '" height="80" style="border-radius:4px;border:1px solid #ddd;padding:2px">'
                  + '<a data-idx="' + i + '" class="del-store-img" style="position:absolute;top:-6px;right:-6px;background:#e74c3c;color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;cursor:pointer;font-size:12px">&times;</a>'
                  + '</div>';
        }
        $('#imagesPreview').html(html);
    }

    $(function() {
        $('#uploadLogo').on('change', function() { uploadLogo(this); });
        $('#uploadImages').on('change', function() {
            var input = this;
            if (!input.files || !input.files.length) return;
            var files = Array.prototype.slice.call(input.files);
            var done = 0;
            files.forEach(function(f) {
                var fd = new FormData();
                fd.append('file', f);
                $.ajax({
                    url: ctx + 'common/upload', type: 'POST', data: fd,
                    processData: false, contentType: false,
                    success: function(res) {
                        if (res.code === 0) { storeImages.push(res.path); }
                        else { $.modal.alertWarning(res.msg); }
                    },
                    complete: function() { if (++done === files.length) renderImages(); }
                });
            });
            input.value = '';
        });
        $('#imagesPreview').on('click', '.del-store-img', function() {
            var idx = parseInt($(this).data('idx'), 10);
            storeImages.splice(idx, 1);
            renderImages();
        });
    });
</script>
</body>
</html>
