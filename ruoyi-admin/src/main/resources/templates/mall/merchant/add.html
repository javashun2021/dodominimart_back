<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-merchant-add">
        <div class="form-group">
            <label class="col-sm-3 control-label">Merchant Name：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="name" required></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Category：</label>
            <div class="col-sm-8">
                <select class="form-control" name="category" th:with="type=${@dict.getType('mall_merchant_type')}">
                    <option th:each="d : ${type}" th:text="${d.dictLabel}" th:value="${d.dictValue}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Description：</label>
            <div class="col-sm-8"><textarea class="form-control" name="description" rows="2"></textarea></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Address：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="address"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Latitude：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" step="0.0000001" name="lat" placeholder="e.g. 14.5995000">
                <span class="help-block">用于 App「附近商家」按 GPS 距离排序，务必填真实坐标</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Longitude：</label>
            <div class="col-sm-8"><input class="form-control" type="number" step="0.0000001" name="lng" placeholder="e.g. 120.9842000"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Phone：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="phone"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Business Hours：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="businessHours" placeholder="08:00-22:00"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Logo URL：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="logoUrl"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Images (comma URLs)：</label>
            <div class="col-sm-8"><textarea class="form-control" name="images" rows="2"></textarea></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Sort：</label>
            <div class="col-sm-8"><input class="form-control" type="number" name="sort" value="0"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Status：</label>
            <div class="col-sm-8">
                <select class="form-control" name="status">
                    <option value="0">Pending</option>
                    <option value="1">Open</option>
                    <option value="3">Suspended</option>
                </select>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script>
    var prefix = ctx + "mall/merchant";
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/add", $('#form-merchant-add').serialize());
        }
    }
</script>
</body>
</html>
