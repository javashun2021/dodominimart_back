<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-product-edit">
        <input type="hidden" name="productId" th:value="${product.productId}">
        <div class="form-group">
            <label class="col-sm-3 control-label">Product Name：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="name" th:value="${product.name}" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Brand：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="brandName" th:value="${product.brandName}" placeholder="Optional, shown on product image">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Category：</label>
            <div class="col-sm-8">
                <select class="form-control" name="categoryId" required>
                    <option th:each="c : ${categories}"
                            th:value="${c.categoryId}"
                            th:text="${c.name}"
                            th:selected="${c.categoryId == product.categoryId}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Price (元)：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" step="0.01" min="0" name="price" th:value="${product.price}" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Stock：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" min="0" name="stock" th:value="${product.stock}" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Product Image：</label>
            <div class="col-sm-8">
                <div class="input-group">
                    <input class="form-control" type="text" id="imageUrl" name="imageUrl" th:value="${product.imageUrl}">
                    <span class="input-group-btn">
                        <label class="btn btn-default" for="uploadImg"><i class="fa fa-upload"></i> Upload</label>
                        <input type="file" id="uploadImg" accept="image/*" style="display:none" onchange="uploadImage(this)">
                    </span>
                </div>
                <div id="imgPreview" th:style="${product.imageUrl != null and product.imageUrl != ''} ? 'margin-top:8px' : 'margin-top:8px;display:none'">
                    <img id="previewImg" th:src="${product.imageUrl}" height="80" style="border-radius:4px;border:1px solid #ddd;padding:2px">
                </div>
                <span class="help-block" style="margin-bottom:0;">封面图，用于列表/购物车缩略图</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">More Images：</label>
            <div class="col-sm-8">
                <input type="hidden" id="images" name="images" th:value="${product.images}">
                <span class="input-group-btn">
                    <label class="btn btn-default" for="uploadMore"><i class="fa fa-plus"></i> Add images</label>
                    <input type="file" id="uploadMore" accept="image/*" multiple style="display:none" onchange="uploadMore(this)">
                </span>
                <div id="morePreview" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"></div>
                <span class="help-block" style="margin-bottom:0;">附加图，App 详情页可左右滑动查看（可多张，可删除）</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Attribute Name：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="specName" th:value="${product.specName}" placeholder="如 口味 / Flavor（留空=无属性）">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Options：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="specOptions" th:value="${product.specOptions}" placeholder="逗号分隔，如 苹果味,水蜜桃味,原味">
                <span class="help-block" style="margin-bottom:0;">顾客下单时选一个（各选项共用价格与库存）</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Description：</label>
            <div class="col-sm-8">
                <textarea class="form-control" name="description" rows="3" th:text="${product.description}"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Sort：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" name="sort" th:value="${product.sort}">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Status：</label>
            <div class="col-sm-8">
                <div class="radio-box">
                    <input type="radio" id="s0" name="status" value="0" th:checked="${product.status == '0'}">
                    <label for="s0">Active</label>
                </div>
                <div class="radio-box">
                    <input type="radio" id="s1" name="status" value="1" th:checked="${product.status == '1'}">
                    <label for="s1">Inactive</label>
                </div>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script>
    var prefix = ctx + "mall/product";
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-product-edit').serialize());
        }
    }
    function uploadImage(input) {
        if (!input.files || !input.files[0]) return;
        var formData = new FormData();
        formData.append('file', input.files[0]);
        $.ajax({
            url: ctx + 'common/upload',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(res) {
                if (res.code === 0) {
                    $('#imageUrl').val(res.path);
                    $('#previewImg').attr('src', res.url);
                    $('#imgPreview').show();
                } else {
                    $.modal.alertWarning(res.msg);
                }
            }
        });
    }

    // ── 多图（附加图）────────────────────────────────────────────────
    var moreImages = [];
    (function initMore() {
        var raw = $('#images').val();
        if (raw) {
            moreImages = raw.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
        }
        renderMore();
    })();
    function renderMore() {
        $('#images').val(moreImages.join(','));
        var html = '';
        for (var i = 0; i < moreImages.length; i++) {
            html += '<div style="position:relative;display:inline-block">'
                  + '<img src="' + moreImages[i] + '" height="80" style="border-radius:4px;border:1px solid #ddd;padding:2px">'
                  + '<a onclick="removeMore(' + i + ')" style="position:absolute;top:-6px;right:-6px;background:#e74c3c;color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;cursor:pointer;font-size:12px">&times;</a>'
                  + '</div>';
        }
        $('#morePreview').html(html);
    }
    function removeMore(i) {
        moreImages.splice(i, 1);
        renderMore();
    }
    function uploadMore(input) {
        if (!input.files || !input.files.length) return;
        var files = Array.prototype.slice.call(input.files);
        var done = 0;
        files.forEach(function(f) {
            var fd = new FormData();
            fd.append('file', f);
            $.ajax({
                url: ctx + 'common/upload', type: 'POST', data: fd,
                processData: false, contentType: false,
                success: function(res) {
                    if (res.code === 0) { moreImages.push(res.path); }
                    else { $.modal.alertWarning(res.msg); }
                },
                complete: function() { if (++done === files.length) renderMore(); }
            });
        });
        input.value = '';
    }
</script>
</body>
</html>
