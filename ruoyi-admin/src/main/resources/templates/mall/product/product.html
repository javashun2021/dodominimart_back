<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="product-form">
                <div class="select-list">
                    <ul>
                        <li>Product Name：<input type="text" name="name"/></li>
                        <li>
                            Status：
                            <select name="status">
                                <option value="">All</option>
                                <option value="0">Active</option>
                                <option value="1">Inactive</option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Search</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Reset</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>
        <div class="btn-group-sm hidden-xs" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="mall:product:add">
                <i class="fa fa-plus"></i> Add
            </a>
            <a class="btn btn-primary btn-edit disabled" onclick="$.operate.edit()" shiro:hasPermission="mall:product:edit">
                <i class="fa fa-edit"></i> Edit
            </a>
            <a class="btn btn-danger btn-del disabled" onclick="$.operate.removeAll()" shiro:hasPermission="mall:product:remove">
                <i class="fa fa-remove"></i> Delete
            </a>
            <a class="btn btn-info" onclick="printLabels()" shiro:hasPermission="mall:product:view">
                <i class="fa fa-tags"></i> Print Label
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-mobile-responsive="true"></table>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    var editFlag   = [[${@permission.hasPermi('mall:product:edit')}]];
    var removeFlag = [[${@permission.hasPermi('mall:product:remove')}]];
    var prefix = ctx + "mall/product";

    // 打印标签：取勾选商品 → 询问份数 → 新标签页打开标签打印页
    function printLabels() {
        var ids = $.table.selectColumns('productId');
        if (ids.length === 0) {
            $.modal.alertWarning('Please select at least one product');
            return;
        }
        var copies = prompt('Copies per product?', '1');
        if (copies === null) return;
        copies = parseInt(copies, 10);
        if (isNaN(copies) || copies < 1) copies = 1;
        window.open(prefix + '/label?ids=' + ids.join(',') + '&copies=' + copies);
    }

    // 一键切换首页精选：点星星 → 确认 → POST → 自动刷新列表
    function toggleFeatured(id, cur) {
        var next = cur == 1 ? 0 : 1;
        var tip = next == 1
            ? 'Feature this product in the app home page?'
            : 'Remove this product from the home Featured section?';
        $.modal.confirm(tip, function() {
            $.operate.post(prefix + "/changeFeatured", { productId: id, isFeatured: next });
        });
    }

    $(function() {
        $.table.init({
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            modalName: "Product",
            columns: [
                {checkbox: true},
                {field: 'productId', title: 'ID'},
                {field: 'imageUrl',  title: 'Image', formatter: function(v) {
                    return v ? '<img src="' + v + '" height="40" style="border-radius:4px">' : '-';
                }},
                {field: 'name',      title: 'Product Name'},
                {field: 'price',     title: 'Price (PHP)', formatter: function(v) { return '₱' + v; }},
                {field: 'stock',     title: 'Stock'},
                {field: 'status',    title: 'Status', align: 'center',
                    formatter: function(v) {
                        return v === '0'
                            ? '<span class="badge badge-primary">Active</span>'
                            : '<span class="badge badge-default">Inactive</span>';
                    }
                },
                {field: 'isFeatured', title: 'Featured', align: 'center',
                    formatter: function(v, row) {
                        var on = (v == 1);
                        return '<a class="btn btn-xs ' + (on ? 'btn-warning' : 'btn-default') + ' ' + editFlag + '"'
                             + ' onclick="toggleFeatured(\'' + row.productId + '\',' + (on ? 1 : 0) + ')">'
                             + '<i class="fa ' + (on ? 'fa-star' : 'fa-star-o') + '"></i> '
                             + (on ? 'Featured' : 'Normal') + '</a>';
                    }
                },
                {field: 'createTime', title: 'Created At'},
                {title: 'Action', align: 'center', formatter: function(v, row) {
                    var a = [];
                    a.push('<a class="btn btn-success btn-xs ' + editFlag + '" onclick="$.operate.edit(\'' + row.productId + '\')"><i class="fa fa-edit"></i>Edit</a> ');
                    a.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" onclick="$.operate.remove(\'' + row.productId + '\')"><i class="fa fa-remove"></i>Delete</a>');
                    return a.join('');
                }}
            ]
        });
    });
</script>
</body>
</html>
