<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>Product Labels</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f0f0f0; font-family: Arial, "Microsoft YaHei", sans-serif; }

    /* 工具栏（打印时隐藏） */
    .toolbar {
        position: sticky; top: 0; z-index: 10;
        background: #fff; padding: 12px 16px; border-bottom: 1px solid #ddd;
        display: flex; align-items: center; gap: 12px;
    }
    .toolbar button, .toolbar select {
        height: 34px; padding: 0 14px; border: 1px solid #ccc; border-radius: 4px;
        background: #fff; cursor: pointer; font-size: 14px;
    }
    .toolbar button.primary { background: #1ab394; color: #fff; border-color: #1ab394; }
    .toolbar .muted { color: #888; font-size: 13px; }

    /* 标签纸张：默认 40mm × 30mm，可在工具栏切换 */
    .sheet { padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .label {
        width: 40mm; height: 30mm; padding: 1.5mm 2mm;
        background: #fff; border: 1px dashed #bbb;
        display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        overflow: hidden; page-break-inside: avoid;
    }
    body.size-50x30 .label { width: 50mm; height: 30mm; }
    body.size-60x40 .label { width: 60mm; height: 40mm; }

    .label .store { font-size: 8pt; font-weight: 700; letter-spacing: .5px; line-height: 1; }
    .label .pname {
        font-size: 8pt; line-height: 1.05; text-align: center; width: 100%;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .label .price { font-size: 13pt; font-weight: 800; line-height: 1; }
    .label .barcode { width: 100%; text-align: center; }
    .label .barcode img { max-width: 100%; height: 8mm; object-fit: contain; }
    .label .code { font-size: 7pt; letter-spacing: 1px; line-height: 1; }

    .empty { padding: 60px; text-align: center; color: #999; }

    @media print {
        body { background: #fff; }
        .toolbar { display: none; }
        .sheet { padding: 0; gap: 0; }
        .label { border: none; }
        @page { margin: 4mm; }
    }
</style>
</head>
<body class="size-40x30">
    <div class="toolbar">
        <button class="primary" onclick="window.print()">🖨 Print</button>
        <label class="muted">Label size:
            <select onchange="document.body.className = 'size-' + this.value">
                <option value="40x30">40 × 30 mm</option>
                <option value="50x30">50 × 30 mm</option>
                <option value="60x40">60 × 40 mm</option>
            </select>
        </label>
        <span class="muted" th:text="'Total labels: ' + ${#lists.size(labels)}">Total labels: 0</span>
        <a class="muted" href="javascript:window.close()" style="margin-left:auto;">Close</a>
    </div>

    <div class="sheet" th:if="${not #lists.isEmpty(labels)}">
        <div class="label" th:each="l : ${labels}">
            <div class="store" th:text="${storeName}">DODOMINIMART</div>
            <div class="pname" th:text="${l.name}">Product Name</div>
            <div class="price" th:text="'₱' + ${l.price}">₱0.00</div>
            <div class="barcode">
                <img th:if="${l.barcodeImg != ''}" th:src="${l.barcodeImg}" alt="barcode"/>
                <div class="code" th:text="${l.code}">P0000000</div>
            </div>
        </div>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(labels)}">
        No products selected. Go back, tick some products, then click <b>Print Label</b>.
    </div>
</body>
</html>
