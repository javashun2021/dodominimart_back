<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-product-add">
        <div class="form-group">
            <label class="col-sm-3 control-label">Product Name：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="name" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Brand：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="brandName" placeholder="Optional, shown on product image">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Category：</label>
            <div class="col-sm-8">
                <select class="form-control" name="categoryId" required>
                    <option value="">Select category</option>
                    <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.name}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Price (PHP)：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" step="0.01" min="0" name="price" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Stock：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" min="0" name="stock" value="0" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Product Image：</label>
            <div class="col-sm-8">
                <div class="input-group">
                    <input class="form-control" type="text" id="imageUrl" name="imageUrl" placeholder="Auto-filled after upload">
                    <span class="input-group-btn">
                        <label class="btn btn-default" for="uploadImg"><i class="fa fa-upload"></i> Upload</label>
                        <input type="file" id="uploadImg" accept="image/*" style="display:none" onchange="uploadImage(this)">
                    </span>
                </div>
                <div id="imgPreview" style="margin-top:8px;display:none">
                    <img id="previewImg" height="80" style="border-radius:4px;border:1px solid #ddd;padding:2px">
                </div>
                <span class="help-block" style="margin-bottom:0;">Cover image — used as thumbnail in product list and cart</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">More Images：</label>
            <div class="col-sm-8">
                <input type="hidden" id="images" name="images" value="">
                <span class="input-group-btn">
                    <label class="btn btn-default" for="uploadMore"><i class="fa fa-plus"></i> Add images</label>
                    <input type="file" id="uploadMore" accept="image/*" multiple style="display:none">
                </span>
                <div id="morePreview" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"></div>
                <span class="help-block" style="margin-bottom:0;">Additional images — swipeable gallery on product detail page (multiple allowed, tap × to remove)</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Attribute Name：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="specName" placeholder="e.g. Flavor (leave blank if no variants)">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Options：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="specOptions" placeholder="Comma-separated, e.g. Apple,Peach,Original">
                <span class="help-block" style="margin-bottom:0;">Customer picks one option per order (all options share the same price and stock)</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Description：</label>
            <div class="col-sm-8">
                <textarea class="form-control" name="description" rows="3" placeholder="Optional"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Sort：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" name="sort" value="0">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Status：</label>
            <div class="col-sm-8">
                <div class="radio-box">
                    <input type="radio" id="s0" name="status" value="0" checked>
                    <label for="s0">Active</label>
                </div>
                <div class="radio-box">
                    <input type="radio" id="s1" name="status" value="1">
                    <label for="s1">Inactive</label>
                </div>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script>
    var prefix = ctx + "mall/product";
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/add", $('#form-product-add').serialize());
        }
    }
    function uploadImage(input) {
        if (!input.files || !input.files[0]) return;
        var formData = new FormData();
        formData.append('file', input.files[0]);
        $.ajax({
            url: ctx + 'common/upload',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(res) {
                if (res.code === 0) {
                    $('#imageUrl').val(res.path);
                    $('#previewImg').attr('src', res.url);
                    $('#imgPreview').show();
                } else {
                    $.modal.alertWarning(res.msg);
                }
            }
        });
    }

    var moreImages = [];
    var moreUrls   = [];

    function renderMore() {
        $('#images').val(moreImages.join(','));
        var html = '';
        for (var i = 0; i < moreUrls.length; i++) {
            html += '<div style="position:relative;display:inline-block">'
                  + '<img src="' + moreUrls[i] + '" height="80" style="border-radius:4px;border:1px solid #ddd;padding:2px">'
                  + '<a data-idx="' + i + '" class="del-more-img" style="position:absolute;top:-6px;right:-6px;background:#e74c3c;color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;cursor:pointer;font-size:12px">&times;</a>'
                  + '</div>';
        }
        $('#morePreview').html(html);
    }

    $(function() {
        $('#uploadMore').on('change', function() {
            var input = this;
            if (!input.files || !input.files.length) return;
            var files = Array.prototype.slice.call(input.files);
            var done = 0;
            files.forEach(function(f) {
                var fd = new FormData();
                fd.append('file', f);
                $.ajax({
                    url: ctx + 'common/upload', type: 'POST', data: fd,
                    processData: false, contentType: false,
                    success: function(res) {
                        if (res.code === 0) {
                            moreImages.push(res.path);
                            moreUrls.push(res.url);
                        } else {
                            $.modal.alertWarning(res.msg);
                        }
                    },
                    complete: function() { if (++done === files.length) renderMore(); }
                });
            });
            input.value = '';
        });
        $('#morePreview').on('click', '.del-more-img', function() {
            var idx = parseInt($(this).data('idx'), 10);
            moreImages.splice(idx, 1);
            moreUrls.splice(idx, 1);
            renderMore();
        });
    });
</script>
</body>
</html>
