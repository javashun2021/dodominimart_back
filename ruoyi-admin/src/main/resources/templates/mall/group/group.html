<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="group-form">
                <div class="select-list">
                    <ul>
                        <li>活动名称：<input type="text" name="title"/></li>
                        <li>状态：
                            <select name="status">
                                <option value="">全部</option>
                                <option value="0">进行中</option>
                                <option value="1">已结束</option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>
        <div class="btn-group-sm hidden-xs" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="mall:group:add">
                <i class="fa fa-plus"></i> 新增
            </a>
            <a class="btn btn-info" th:href="@{/mall/group/orders}">
                <i class="fa fa-list-ul"></i> 拼团单监控
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-mobile-responsive="true"></table>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    var editFlag   = [[${@permission.hasPermi('mall:group:edit')}]];
    var removeFlag = [[${@permission.hasPermi('mall:group:remove')}]];
    var prefix = ctx + "mall/group";

    $(function() {
        $.table.init({
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            modalName: "拼团活动",
            columns: [
                {checkbox: true},
                {field: 'activityId',    title: 'ID'},
                {field: 'productName',   title: '商品名称'},
                {field: 'title',         title: '活动名称'},
                {field: 'minGroupSize',  title: '最小开团人数'},
                {field: 'durationHours', title: '成团时限(h)'},
                {field: 'startTime',     title: '开始时间'},
                {field: 'endTime',       title: '结束时间'},
                {field: 'status', title: '状态', align: 'center',
                    formatter: function(v) {
                        return v === '0'
                            ? '<span class="badge badge-primary">进行中</span>'
                            : '<span class="badge badge-default">已结束</span>';
                    }
                },
                {title: '操作', align: 'center', formatter: function(v, row) {
                    var a = [];
                    if (row.status === '0') {
                        a.push('<a class="btn btn-success btn-xs ' + editFlag + '" onclick="$.operate.edit(\'' + row.activityId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        a.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" onclick="$.operate.remove(\'' + row.activityId + '\')"><i class="fa fa-remove"></i>结束</a>');
                    }
                    return a.join('');
                }}
            ]
        });
    });
</script>
</body>
</html>
