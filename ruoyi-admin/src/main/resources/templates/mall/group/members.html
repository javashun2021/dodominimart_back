<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <h4>Group Members &nbsp;<small th:text="'Group Order: #' + ${groupOrderId}"></small></h4>
    <table class="table table-bordered table-hover">
        <thead>
            <tr>
                <th>#</th>
                <th>昵称</th>
                <th>数量</th>
                <th>加入时间</th>
                <th>订单ID</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="m,i : ${members}">
                <td th:text="${i.count}"></td>
                <td th:text="${m.nickName != null ? m.nickName : m.memberId}"></td>
                <td th:text="${m.quantity}"></td>
                <td th:text="${#dates.format(m.joinedTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <span th:if="${m.orderId != null}">
                        <a th:href="@{/mall/order/detail/{id}(id=${m.orderId})}" th:text="${m.orderId}"></a>
                    </span>
                    <span th:unless="${m.orderId != null}" class="text-muted">Pending</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(members)}">
                <td colspan="5" class="text-center text-muted">No members yet</td>
            </tr>
        </tbody>
    </table>
    <a class="btn btn-default btn-sm" onclick="history.back()"><i class="fa fa-arrow-left"></i> Back</a>
</div>
<div th:include="include :: footer"></div>
</body>
</html>
