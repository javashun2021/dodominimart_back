<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-group-add">
        <input type="hidden" name="tiersJson" id="tiersJson"/>
        <div class="form-group">
            <label class="col-sm-3 control-label">活动名称：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" name="title" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">商品ID：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" name="productId" required placeholder="请输入商品ID">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">最小开团人数：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" min="2" name="minGroupSize" value="2" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">成团时限(小时)：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" min="1" name="durationHours" value="24" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">开始时间：</label>
            <div class="col-sm-8">
                <input class="form-control" type="datetime-local" name="startTime" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">结束时间：</label>
            <div class="col-sm-8">
                <input class="form-control" type="datetime-local" name="endTime" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">状态：</label>
            <div class="col-sm-8">
                <div class="radio-box">
                    <input type="radio" id="s0" name="status" value="0" checked>
                    <label for="s0">进行中</label>
                </div>
                <div class="radio-box">
                    <input type="radio" id="s1" name="status" value="1">
                    <label for="s1">已结束</label>
                </div>
            </div>
        </div>

        <!-- 价格阶梯 -->
        <div class="form-group">
            <label class="col-sm-3 control-label">价格阶梯：</label>
            <div class="col-sm-8">
                <table class="table table-bordered" id="tierTable">
                    <thead>
                        <tr>
                            <th>最少人数</th>
                            <th>最多人数（空=无上限）</th>
                            <th>单价(PHP)</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tierBody">
                        <tr>
                            <td><input type="number" class="form-control tier-min" min="1" placeholder="例：2" required></td>
                            <td><input type="number" class="form-control tier-max" min="1" placeholder="留空=无上限"></td>
                            <td><input type="number" class="form-control tier-price" step="0.01" min="0" placeholder="例：30.00" required></td>
                            <td><button type="button" class="btn btn-danger btn-xs" onclick="removeTier(this)">删除</button></td>
                        </tr>
                    </tbody>
                </table>
                <button type="button" class="btn btn-info btn-sm" onclick="addTierRow()">
                    <i class="fa fa-plus"></i> 添加档位
                </button>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script>
    var prefix = ctx + "mall/group";

    function addTierRow() {
        $('#tierBody').append('<tr>' +
            '<td><input type="number" class="form-control tier-min" min="1" placeholder="例：5" required></td>' +
            '<td><input type="number" class="form-control tier-max" min="1" placeholder="留空=无上限"></td>' +
            '<td><input type="number" class="form-control tier-price" step="0.01" min="0" placeholder="例：25.00" required></td>' +
            '<td><button type="button" class="btn btn-danger btn-xs" onclick="removeTier(this)">删除</button></td>' +
        '</tr>');
    }

    function removeTier(btn) {
        $(btn).closest('tr').remove();
    }

    function buildTiersJson() {
        var parts = [];
        $('#tierBody tr').each(function() {
            var min   = $(this).find('.tier-min').val().trim();
            var max   = $(this).find('.tier-max').val().trim();
            var price = $(this).find('.tier-price').val().trim();
            if (min && price) parts.push(min + ',' + max + ',' + price);
        });
        return parts.join(';');
    }

    function submitHandler() {
        $('#tiersJson').val(buildTiersJson());
        if ($.validate.form()) {
            $.operate.save(prefix + "/add", $('#form-group-add').serialize());
        }
    }
</script>
</body>
</html>
