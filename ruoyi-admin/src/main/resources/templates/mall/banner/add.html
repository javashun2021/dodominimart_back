<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-banner-add">
        <div class="form-group">
            <label class="col-sm-3 control-label">Image URL<span class="red">*</span></label>
            <div class="col-sm-8">
                <input name="imageUrl" class="form-control" type="text" required placeholder="Enter image URL or use upload"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Link Type</label>
            <div class="col-sm-8">
                <select name="linkType" class="form-control">
                    <option value="NONE">No Link</option>
                    <option value="PRODUCT">Product</option>
                    <option value="GROUP">Group Buy</option>
                    <option value="URL">External URL</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Link Value</label>
            <div class="col-sm-8">
                <input name="linkValue" class="form-control" type="text" placeholder="Product ID / Group Buy ID / Full URL"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Sort</label>
            <div class="col-sm-8">
                <input name="sort" class="form-control" type="number" value="0"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Status</label>
            <div class="col-sm-8">
                <select name="status" class="form-control">
                    <option value="0">Enabled</option>
                    <option value="1">Disabled</option>
                </select>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    var prefix = ctx + "mall/banner";
    $("#form-banner-add").validate({
        focusCleanup: true
    });
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/add", $('#form-banner-add').serialize());
        }
    }
</script>
</body>
</html>
