<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-banner-add">
        <div class="form-group">
            <label class="col-sm-3 control-label">图片URL<span class="red">*</span></label>
            <div class="col-sm-8">
                <input name="imageUrl" class="form-control" type="text" required placeholder="请输入图片地址或使用上传功能"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">跳转类型</label>
            <div class="col-sm-8">
                <select name="linkType" class="form-control">
                    <option value="NONE">无跳转</option>
                    <option value="PRODUCT">商品</option>
                    <option value="GROUP">拼团</option>
                    <option value="URL">外链</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">跳转值</label>
            <div class="col-sm-8">
                <input name="linkValue" class="form-control" type="text" placeholder="商品ID / 拼团ID / 完整URL"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">排序</label>
            <div class="col-sm-8">
                <input name="sort" class="form-control" type="number" value="0"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">状态</label>
            <div class="col-sm-8">
                <select name="status" class="form-control">
                    <option value="0">启用</option>
                    <option value="1">停用</option>
                </select>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    var prefix = ctx + "mall/banner";
    $("#form-banner-add").validate({
        focusCleanup: true
    });
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/add", $('#form-banner-add').serialize());
        }
    }
</script>
</body>
</html>
