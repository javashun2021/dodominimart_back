<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-store-edit" th:object="${store}">
        <input type="hidden" name="storeId" th:field="*{storeId}">
        <div class="form-group">
            <label class="col-sm-3 control-label">Store Name：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="name" th:field="*{name}" required></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">归属商户：</label>
            <div class="col-sm-8">
                <select class="form-control" name="merchantId" th:field="*{merchantId}">
                    <option value="">(自营/无归属)</option>
                    <option th:each="m : ${merchants}" th:value="${m.merchantId}" th:text="${m.name}"></option>
                </select>
                <span class="help-block">该门店属于哪个商户；决定「按店库存」可配的商品范围。</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Address：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="address" th:field="*{address}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Latitude：</label>
            <div class="col-sm-8">
                <input class="form-control" type="number" step="0.0000001" name="lat" th:field="*{lat}" placeholder="e.g. 14.5995000">
                <span class="help-block">用于 App「GPS 就近选店」，务必填真实门店坐标</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Longitude：</label>
            <div class="col-sm-8"><input class="form-control" type="number" step="0.0000001" name="lng" th:field="*{lng}" placeholder="e.g. 120.9842000"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Phone：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="phone" th:field="*{phone}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Service Radius (km)：</label>
            <div class="col-sm-8"><input class="form-control" type="number" step="0.01" name="serviceRadiusKm" th:field="*{serviceRadiusKm}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Business Hours：</label>
            <div class="col-sm-8"><input class="form-control" type="text" name="businessHours" th:field="*{businessHours}" placeholder="08:00-22:00"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Sort：</label>
            <div class="col-sm-8"><input class="form-control" type="number" name="sort" th:field="*{sort}"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Status：</label>
            <div class="col-sm-8">
                <div class="radio-box">
                    <input type="radio" name="status" value="0" th:field="*{status}">
                    <label>Open</label>
                </div>
                <div class="radio-box">
                    <input type="radio" name="status" value="1" th:field="*{status}">
                    <label>Closed</label>
                </div>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script>
    var prefix = ctx + "mall/store";
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-store-edit').serialize());
        }
    }
</script>
</body>
</html>
