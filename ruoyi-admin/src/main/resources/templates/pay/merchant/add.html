<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-merchant-add">
        <div class="form-group">
            <label class="col-sm-3 control-label">商户号(站点码)<span class="red">*</span></label>
            <div class="col-sm-8">
                <input name="code" class="form-control" type="text" required placeholder="Request-Site-Code，如 58qp（唯一）"/>
                <p class="help-block">商户下单时通过请求头 Request-Site-Code 传此值</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">商户名</label>
            <div class="col-sm-8">
                <input name="name" class="form-control" type="text" placeholder="商户名称"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">状态</label>
            <div class="col-sm-8">
                <select name="status" class="form-control">
                    <option value="Enable">启用</option>
                    <option value="Disable">停用</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">备注</label>
            <div class="col-sm-8">
                <input name="summary" class="form-control" type="text"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Telegram ChatIds</label>
            <div class="col-sm-8">
                <input name="telegramChatIds" class="form-control" type="text" placeholder="多个用逗号分隔（可空）"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">签名密钥</label>
            <div class="col-sm-8">
                <p class="form-control-static"><i class="fa fa-info-circle"></i> 保存后系统自动生成 32 位密钥(app_secret)，请到列表复制给商户</p>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    var prefix = ctx + "pay/merchant";
    $("#form-merchant-add").validate({focusCleanup: true});

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/add", $('#form-merchant-add').serialize());
        }
    }
</script>
</body>
</html>
