<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-merchant-edit" th:object="${merchant}">
        <input name="id" type="hidden" th:field="*{id}"/>
        <div class="form-group">
            <label class="col-sm-3 control-label">商户号(站点码)</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" th:value="*{code}" readonly/>
                <p class="help-block">商户号不可修改</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">商户名</label>
            <div class="col-sm-8">
                <input name="name" class="form-control" type="text" th:field="*{name}"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">签名密钥(KEY)</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" th:value="*{appSecret}" readonly/>
                <p class="help-block">如需更换，请在列表点「重置密钥」</p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">状态</label>
            <div class="col-sm-8">
                <select name="status" class="form-control" th:field="*{status}">
                    <option value="Enable">启用</option>
                    <option value="Disable">停用</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">备注</label>
            <div class="col-sm-8">
                <input name="summary" class="form-control" type="text" th:field="*{summary}"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">Telegram ChatIds</label>
            <div class="col-sm-8">
                <input name="telegramChatIds" class="form-control" type="text" th:field="*{telegramChatIds}"/>
            </div>
        </div>
    </form>
</div>
<div th:include="include :: footer"></div>
<script th:inline="javascript">
    var prefix = ctx + "pay/merchant";
    $("#form-merchant-edit").validate({focusCleanup: true});

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-merchant-edit').serialize());
        }
    }
</script>
</body>
</html>
