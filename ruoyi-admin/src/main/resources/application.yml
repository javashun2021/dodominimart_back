# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.2.0
  # 版权年份
  copyrightYear: 2019
  # 文件上传路径
  # /home/dodominimart/uploadPath/
  # D:/ruoyi/uploadPath/
  profile: /home/dodominimart/uploadPath/
  # 获取ip地址开关
  addressEnabled: true

# 开发环境配置
server:
  # 服务端口
  port: 8080
  servlet:
    # 项目contextPath
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # tomcat最大线程数，默认为200
    max-threads: 800
    # Tomcat启动初始化的线程数，默认值25
    min-spare-threads: 30
 
# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: WARN
    org.spring.springboot.dao: debug

# 用户配置
user:
  password:
    # 密码错误{maxRetryCount}次锁定10分钟
    maxRetryCount: 5

# Spring配置
spring:
  # 模板引擎
  thymeleaf:
    mode: HTML
    encoding: utf-8
    # 禁用缓存
    cache: false
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  profiles: 
    active: druid
  # 文件上传
  servlet:
     multipart:
       max-file-size:  5MB
       max-request-size:  5MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # 邮件（网易 163 SMTP，SSL 465；国内发验证码用，替代被墙/慢的 Gmail）。
  # password = 163「授权码」（后台开启 SMTP 服务后生成的那串，非登录密码）。
  # 以下均可用环境变量覆盖：MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD/MAIL_SSL_ENABLE。
  # ⚠️ from（mall.mail.from）必须与 username 完全一致，否则 163 拒发。
  #    如需换号，可在服务器 systemd drop-in 里设 MAIL_USERNAME/MAIL_PASSWORD/MAIL_FROM 覆盖，不用重打包。
  #    当前默认为已验证可用账号 18522783902@163.com（2026-08 服务器实测 235 登录成功 + 真实发信成功）。
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:18522783902@163.com}
    password: ${MAIL_PASSWORD:LZii5PTDXJeDNrTZ}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLE:true}
      mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory
      mail.smtp.socketFactory.port: 465

# MyBatis
mybatis:
    # 搜索指定包别名
    typeAliasesPackage: com.ruoyi
    # 配置mapper的扫描，找到所有的mapper.xml映射文件
    mapperLocations: classpath*:mapper/**/*Mapper.xml
    # 加载全局的配置文件
    configLocation: classpath:mapper/mybatis-config.xml

# PageHelper分页插件
pagehelper: 
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql 

# Shiro
shiro:
  user:
    # 登录地址
    loginUrl: /login
    # 权限认证失败地址
    unauthorizedUrl: /unauth
    # 首页地址
    indexUrl: /index
    # 验证码开关
    captchaEnabled: true
    # 验证码类型 math 数组计算 char 字符
    captchaType: math
  cookie:
    # 设置Cookie的域名 默认空，即当前访问的域名
    domain: 
    # 设置cookie的有效访问路径
    path: /
    # 设置HttpOnly属性
    httpOnly: true
    # 设置Cookie的过期时间，天为单位
    maxAge: 30
  session:
    # Session超时时间（默认30分钟）
    expireTime: 30
    # 同步session到数据库的周期（默认1分钟）
    dbSyncPeriod: 1
    # 相隔多久检查一次session的有效性，默认就是10分钟
    validationInterval: 10

# 防止XSS攻击
xss: 
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 商城 JWT 配置
mall:
  jwt:
    # 签名密钥（生产环境请换成 32 位以上随机字符串）
    secret: dodominimart-jwt-secret-key-2025
    # token 有效期（秒），默认 30 天
    expiration: 2592000
  apple:
    # iOS App Bundle ID，用于验证 identityToken 的 aud 字段
    bundle-id: com.dodominimart.app
    # Web（Sign in with Apple JS）用的 Services ID；web 端 identityToken 的 aud 是它而非 Bundle ID。留空则不接受 web 登录。
    web-client-id: com.dodominimart.web
  fcm:
    # FCM 推送开关。默认 true 兼容海外部署；国内部署（谷歌被墙）请用环境变量
    # MALL_FCM_ENABLED=false 关闭，避免下单时同步调用谷歌卡住（~90s 连接超时）。
    # 注：代码已改为异步发送，开启也不再阻塞下单；此开关用于国内彻底跳过。
    enabled: true
  telegram:
    # 后台提醒机器人（@dodominimart_bot）：下单/接单/拼团/新注册等推到管理群
    # 注意：bot-token 是密钥。可用环境变量 MALL_TELEGRAM_BOT_TOKEN 覆盖。留空则静默不发。
    # 国内部署用 MALL_TELEGRAM_ENABLED=false 关闭（api.telegram.org 同样被墙）。
    bot-token: 8920720410:AAGMqVpcAivZk5WSp5-7BQkiJO4h_AuvDzk
    chat-id: "-5351153130"
    enabled: true
  beta:
    # Android 内测申请：审批链接签名盐（非密码，仅防止他人乱点审批）。可用环境变量 MALL_BETA_APPROVE_SECRET 覆盖。
    approve-secret: dodo-beta-7Qk2pX
    # 拼审批链接用的对外站点根
    public-base-url: https://dodominimart.com
  google:
    # Google OAuth2 Client ID 列表（支持多个，用逗号分隔）
    # Android/Web 用 Web application 类型；iOS 用 iOS 类型
    #clientId: 600271771039-p4bmnq6r0np6bignuiqempniupeb7oqt.apps.googleusercontent.com
    # Android/Web 用 Web application 类型；iOS 用 iOS 类型
    clientIds: 600271771039-arouc217r401svt1q2grf409lbj70860.apps.googleusercontent.com,600271771039-p4bmnq6r0np6bignuiqempniupeb7oqt.apps.googleusercontent.com
  mail:
    from: ${MAIL_FROM:18522783902@163.com}   # 必须与 spring.mail.username 完全一致
    from-name: ${MAIL_FROM_NAME:星智商城}    # 发件人显示名称
  paymongo:
    # PayMongo（菲律宾在线支付，承载 App 里的「GCash」在线支付）。
    # 下面 ${ENV:默认值} 写法：设了环境变量则用环境变量，否则用冒号后的默认值。
    # 现在默认值放的是「测试」key（test 模式不涉及真钱）。
    # ⚠️ 上线换 sk_live 时，不要把 live key 写死在这里提交——改回环境变量或外置 config/。
    secret-key: ${PAYMONGO_SECRET_KEY:sk_live_BkeZ6vffyVxXceC7U3iKQ97d}        # sk_test/sk_live（HTTP Basic 用户名）
    webhook-secret: ${PAYMONGO_WEBHOOK_SECRET:whsk_BNN5qZj1fpUZEYG5SQPU3hjT}  # whsk_xxx（注册 webhook 时拿到，用于验签）
    live: ${PAYMONGO_LIVE:false}                 # true=比对签名头里的 li, false=比对 te
    # 浏览器付完后的回跳落地页（真正置 PAID 靠 webhook，这两个页只是落地）
    success-url: ${PAYMONGO_SUCCESS_URL:https://dodominimart.com/pay-success.html}
    cancel-url: ${PAYMONGO_CANCEL_URL:https://dodominimart.com/pay-cancel.html}
    # 提示：Webhook 地址 = https://dodominimart.com/api/v1/payment/callback
    #       在 PayMongo 后台/API 注册并订阅 checkout_session.payment.paid 事件。
    #       在线支付总开关仍用 sys_config 的 mall.gcash.enabled（true 才放行）。
  lakala:
    # 拉卡拉收银台（线上 H5）——商城线上支付统一走这个。enabled=true 才放行。
    # 当前为「测试」商户参数（网关 https://test.wsmsd.cn/sit，不涉及真钱）。
    # ⚠️ 上线换正式参数：appId/serialNo/merchantNo/termNo 换拉卡拉分配的正式值，
    #    serverUrl 换生产网关，并把 pri-key/证书 换成正式商户自己生成的一套。
    enabled: ${LAKALA_ENABLED:true}
    app-id: ${LAKALA_APP_ID:OP10003874}
    serial-no: ${LAKALA_SERIAL_NO:01a06201eb69}
    merchant-no: ${LAKALA_MERCHANT_NO:82233807538017X}
    term-no: ${LAKALA_TERM_NO:M1950186}
    # 按支付类型选终端：扫码走 term-no-scan，银行卡走 term-no-bankcard；留空则回退 term-no。
    # 前端发起支付时传 payType=SCAN|CARD 决定用哪个。
    term-no-scan: ${LAKALA_TERM_NO_SCAN:M1950186}
    term-no-bankcard: ${LAKALA_TERM_NO_BANKCARD:M1950185}
    server-url: ${LAKALA_SERVER_URL:https://s2.lakala.com}
    # SM4 密钥仅「全报文加密」接口需要；收银台标准下单可留空
    sm4-key: ${LAKALA_SM4_KEY:}
    # 证书/私钥文件路径（服务器上放置，勿入库）
    pri-key-path: ${LAKALA_PRI_KEY_PATH:/home/dodominimart/cert/lakala/OP10003874_private_key.pem}
    lkl-cer-path: ${LAKALA_LKL_CER_PATH:/home/dodominimart/cert/lakala/lkl-apigw-v2.cer}
    lkl-notify-cer-path: ${LAKALA_LKL_NOTIFY_CER_PATH:/home/dodominimart/cert/lakala/lkl-apigw-v2.cer}
    # 支付成功异步通知地址（拉卡拉回调本服务，需外网可达且 /api/ 已被 nginx 代理）
    notify-url: ${LAKALA_NOTIFY_URL:http://zxzwl.top/api/v1/payment/lakala/callback}
    # 付款完成后浏览器回跳的 H5 落地页
    callback-url: ${LAKALA_CALLBACK_URL:http://zxzwl.top/pay-success.html}
    order-efficient-minutes: ${LAKALA_ORDER_EFFICIENT_MINUTES:30}


# 代码生成
gen:
  # 作者
  author: ruoyi
  # 默认生成包路径 system 需改成自己的模块名称 如 system monitor tool
  packageName: com.ruoyi.system
  # 自动去除表前缀，默认是true
  autoRemovePre: true
  # 表前缀(类名不会包含表前缀)
  tablePrefix: sys_